{% extends "base.html" %}

{% block title %}
Form Page
{% endblock %}

{% block content %}

<h1>Send your Feedback</h1>

<form method="POST" action="{{ url_for('register') }}">

    <label for="name">Name:</label>
    <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required
    >

    <br><br>

    <input type="submit" value="Submit">

</form>

{% endblock %}
