<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Feedback Site{% endblock %}</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
            background: #3a0202;
            margin: 0;
        }

        header,
        footer {
            background: #333;
            padding: 10px;
            color: white;
        }

        nav a {
            margin: 0 10px;
            color: antiquewhite;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            max-width: 700px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Feedback Page</h1>

        <nav>
            <a href="/feedback">Feedback</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p> 2026 Feedback Website</p>
    </footer>

</body>
</html>
